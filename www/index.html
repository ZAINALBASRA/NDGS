<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NDGS</title>
<meta name="description" content="Daily technical status report for the NDGS plant">
<meta name="theme-color" content="#c7dcdf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050f13" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NDGS">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<!--fonts:start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Hanken+Grotesk:wght@500;600;700&family=Spline+Sans+Mono:wght@400;500;600&family=Tajawal:wght@500;700&display=swap">
<!--fonts:end-->
<style>
/* Layout: a bento board of soft rounded modules on a sea-mist ground. Water is the motif: a wave-edged header, tank vessels that fill to the entered level, and status pebbles whose inner mark (solid, half, bar) carries state without relying on colour. */
:root{--disp:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;--sans:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"Spline Sans Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono","Courier New",monospace;--ar:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
--page:#c7dcdf;--b1:#d8eef0;--b2:#e5f1ef;--b3:#eff1ea;--card:rgba(255,255,255,.74);--cardbd:rgba(255,255,255,.96);--pop:#ffffff;
--ink:#0c2c37;--mut:#58757e;--ph:rgba(88,117,126,.62);--line:rgba(12,44,55,.17);--fld:rgba(12,44,55,.055);--acc:#127989;--on-acc:#ffffff;--shadow:rgba(12,44,55,.36);
--hero1:#0c3441;--hero2:#17636e;--hero-tx:#e9f7f7;--hero-mut:rgba(233,247,247,.68);--hero-chip:rgba(233,247,247,.15);--wave:#86d6d9;
--liq:#93d6dc;--liq2:#62b9c4;--vbg:rgba(255,255,255,.5);--vline:rgba(12,44,55,.26);
--g-bg:#17855a;--g-fg:#ffffff;--g-halo:rgba(255,255,255,.32);--y-bg:#f0b429;--y-fg:#2d2000;--y-halo:rgba(45,32,0,.2);--r-bg:#c8403a;--r-fg:#ffffff;--r-halo:rgba(255,255,255,.32);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#050f13;--b1:#0b2129;--b2:#0b2a2f;--b3:#0e2a28;--card:rgba(255,255,255,.06);--cardbd:rgba(255,255,255,.09);--pop:#14313b;
--ink:#e2f0f1;--mut:#86a6ac;--ph:rgba(134,166,172,.55);--line:rgba(226,240,241,.17);--fld:rgba(255,255,255,.07);--acc:#6fd3d9;--on-acc:#05262b;--shadow:rgba(0,0,0,.62);
--hero1:#0e3b47;--hero2:#1b6b74;--hero-tx:#eaf8f8;--hero-mut:rgba(234,248,248,.66);--hero-chip:rgba(234,248,248,.14);--wave:#7fd3d6;
--liq:#2a8a95;--liq2:#1a5f6b;--vbg:rgba(255,255,255,.04);--vline:rgba(226,240,241,.26);
color-scheme:dark}}
:root[data-theme="dark"]{--page:#050f13;--b1:#0b2129;--b2:#0b2a2f;--b3:#0e2a28;--card:rgba(255,255,255,.06);--cardbd:rgba(255,255,255,.09);--pop:#14313b;
--ink:#e2f0f1;--mut:#86a6ac;--ph:rgba(134,166,172,.55);--line:rgba(226,240,241,.17);--fld:rgba(255,255,255,.07);--acc:#6fd3d9;--on-acc:#05262b;--shadow:rgba(0,0,0,.62);
--hero1:#0e3b47;--hero2:#1b6b74;--hero-tx:#eaf8f8;--hero-mut:rgba(234,248,248,.66);--hero-chip:rgba(234,248,248,.14);--wave:#7fd3d6;
--liq:#2a8a95;--liq2:#1a5f6b;--vbg:rgba(255,255,255,.04);--vline:rgba(226,240,241,.26);
color-scheme:dark}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-variant-numeric:tabular-nums;background-color:var(--page)}
button,input{font:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sc{direction:ltr;container-type:inline-size;container-name:sc}
.sheet{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;padding:22px;border-radius:34px;background:linear-gradient(165deg,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%);box-shadow:0 40px 70px -44px var(--shadow);font-size:14px;font-weight:600;direction:ltr}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.card{grid-column:span 12;min-width:0;padding:16px 18px 18px;border-radius:26px;background:var(--card);border:1px solid var(--cardbd);box-shadow:0 18px 32px -24px var(--shadow);animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j,0)*60ms)}
.half{grid-column:span 6}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch.mid{justify-content:center}
.ci{display:flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:12px;background:var(--fld);color:var(--acc)}
.ci svg{width:20px;height:20px}
.cl{font-size:12px;font-weight:700;letter-spacing:.16em;white-space:nowrap}
.bd{margin-left:auto;padding:4px 10px;border-radius:999px;background:var(--fld);font-family:var(--mono);font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap}
.g{display:grid;gap:12px}
.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols5{grid-template-columns:repeat(5,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.gap8{gap:8px}
/* status pebbles */
.st{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;width:100%;min-height:46px;padding:0 10px;border:0;border-radius:18px;color:inherit;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.03em;white-space:nowrap;cursor:pointer;box-shadow:0 10px 16px -12px var(--shadow);transition:background-color .45s,color .45s,transform .3s cubic-bezier(.2,.9,.3,1.4);-webkit-tap-highlight-color:transparent}
.st[data-s="0"],.nb.s0{--bg:var(--g-bg);--fg:var(--g-fg);--halo:var(--g-halo)}
.st[data-s="1"],.nb.s1{--bg:var(--y-bg);--fg:var(--y-fg);--halo:var(--y-halo)}
.st[data-s="2"],.nb.s2{--bg:var(--r-bg);--fg:var(--r-fg);--halo:var(--r-halo)}
.st,.nb{background-color:var(--bg);color:var(--fg);background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0))}
.st:hover{transform:translateY(-2px)}.st:active{transform:scale(.95)}.st:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.st.big{min-height:64px;font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:0}
.st.big .gl{position:absolute;right:11px;top:11px}
.st.sm{min-height:40px;padding:0 6px;gap:6px;font-size:11.5px;letter-spacing:.01em;border-radius:15px}
.gl{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:12px;height:12px;border:2px solid transparent;border-radius:50%;transition:background-color .4s,border-color .4s,box-shadow .4s}
.gl b{display:none;width:6px;height:2px;border-radius:1px;background:var(--bg)}
.st[data-s="0"] .gl,.gl.s0{background-color:var(--fg);box-shadow:0 0 0 4px var(--halo)}
.st[data-s="1"] .gl,.gl.s1{border-color:var(--fg);background-image:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
.st[data-s="2"] .gl,.gl.s2{background-color:var(--fg);box-shadow:0 0 0 4px var(--halo)}
.st[data-s="2"] .gl b,.gl.s2 b{display:block}
.st.sm .gl{width:10px;height:10px;border-width:1.5px}
.st.v{min-height:50px;padding:0 34px}
.st.v .gl{position:absolute;left:15px;top:50%;margin-top:-6px}
.st.v input{width:100%;min-width:0;border:0;background:transparent;color:inherit;font-family:var(--mono);font-size:19px;font-weight:500;text-align:center;padding:12px 0}
.st.v input:focus{outline:0}
/* fields */
.fld{position:relative;display:flex;flex-direction:column;gap:1px;min-width:0;padding:7px 10px 6px;border:1.5px solid transparent;border-radius:14px;background:var(--fld);cursor:text;transition:border-color .25s,background-color .25s}
.fld:focus-within{border-color:var(--acc);background-color:var(--card)}
.cp{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--mut);white-space:nowrap;text-align:center}
.fld input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:17px;font-weight:500;text-align:center;padding:2px 0;caret-color:var(--acc)}
.fld input:focus{outline:0}
.pumps .fld .cp{white-space:normal;line-height:1.15}
input::placeholder{color:var(--ph);opacity:1}
.fld.xl input{font-size:24px;padding:5px 0}
.lk{border:1.5px dashed var(--line);background:transparent;cursor:not-allowed}.lk input{pointer-events:none;cursor:not-allowed}
.lki{position:absolute;top:8px;right:9px;width:13px;height:13px;color:var(--mut)}
/* tanks */
.tks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tk{display:flex;flex-direction:column;gap:10px;min-width:0}
.vs{position:relative;height:168px;overflow:hidden;border:2px solid var(--vline);border-radius:24px;background:var(--vbg)}
.lq{position:absolute;left:0;right:0;bottom:0;height:calc(var(--lv,0)*1%);background:linear-gradient(180deg,var(--liq) 0%,var(--liq2) 100%);transition:height .8s cubic-bezier(.2,.8,.2,1)}
.vs.em .lq{display:none}
.wv{position:absolute;left:0;top:-10px;width:200%;height:12px;color:var(--liq);animation:drift 7s linear infinite}
.vt{position:absolute;right:0;width:10px;height:2px;border-radius:1px;background:var(--vline)}
.lv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:text}
.num{display:flex;align-items:baseline;justify-content:center;max-width:92%;font-family:var(--disp);font-size:32px;font-weight:600;line-height:1.15;color:var(--ink)}
.nm{display:inline-grid;min-width:2px;max-width:100%}
.nm::after{content:attr(data-v);grid-area:1/1;visibility:hidden;white-space:pre;font:inherit;pointer-events:none}
.nm input{grid-area:1/1;width:0;min-width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:center;padding:0;caret-color:var(--acc)}
.pc{margin-left:.08em;font-size:.72em;font-weight:600}
.vs.em .pc{margin-left:0;font-size:1em;color:var(--ph)}
.lv input:focus{outline:0}
.lv .cp{color:var(--ink)}
/* rows, produced water, notes */
.rows{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.rl{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.14em;white-space:nowrap}
.un{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap}
.pw{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.ar{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--acc);font-family:var(--mono);font-size:11px;font-weight:500;white-space:nowrap}
.ar svg{width:22px;height:22px}
.ns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nb{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding:14px 8px 12px;border-radius:20px}
.nb .nt{display:flex;align-items:center;gap:12px}
.nb .n{font-family:var(--disp);font-size:36px;font-weight:600;line-height:1}
.nb .cp{color:inherit;font-weight:700;letter-spacing:.08em}
.card.eng{grid-column:3/span 8}
.by{grid-column:1/-1;margin:6px 0 0;padding-left:.24em;text-align:center;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.24em;line-height:1.2;color:var(--mut)}
.ef{flex-direction:row;align-items:center;justify-content:center;gap:12px;padding:10px 16px;border-radius:18px}
.av{display:flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-size:13px;font-weight:700;letter-spacing:.04em}
.ef input{width:100%;min-width:0;text-overflow:ellipsis;border:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:19px;font-weight:700;text-align:center;padding:2px 0;cursor:not-allowed}
.ef input:focus{outline:0}
.ef .lki{position:static;width:15px;height:15px;flex:none}
/* header */
.hero{position:relative;grid-column:span 12;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;overflow:hidden;padding:20px 22px 48px;border-radius:28px;color:var(--hero-tx);background:linear-gradient(120deg,var(--hero1) 0%,var(--hero2) 100%);box-shadow:0 26px 40px -28px var(--shadow);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.hc{position:relative;display:flex;align-items:center;gap:12px;min-width:0}
.hchip{display:flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:15px;background:var(--hero-chip)}
.hchip svg{width:24px;height:24px}
.hh{grid-column:3;justify-self:end;position:relative;padding:0;border:0;color:inherit;cursor:pointer;transition:background-color .2s,transform .15s}
.hh:hover{background:rgba(233,247,247,.26)}.hh:active{transform:scale(.94)}.hh:focus-visible{outline:2px solid var(--hero-tx);outline-offset:3px}
body.exp .hh{display:none}
.hv{display:flex;flex-direction:column;gap:4px;min-width:0}
#dtx{font-family:var(--mono);font-size:23px;font-weight:500;line-height:1.1;white-space:nowrap}
#day{font-size:10.5px;font-weight:700;letter-spacing:.22em;color:var(--hero-mut);white-space:nowrap}
.dov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.ttl{position:relative;margin:0;font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:.08em;text-align:center;white-space:nowrap}
.ttl i{font-style:normal;margin:0 .45em;color:var(--hero-mut)}
.hw{position:absolute;left:0;bottom:0;width:200%;height:36px;color:var(--wave);pointer-events:none}
.hw.a{animation:drift 22s linear infinite}.hw.b{height:28px;animation:drift 34s linear infinite reverse}
/* shift + fleet */
.ctl{position:relative;z-index:6;grid-column:span 12;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:.12s}
.sh{position:relative;z-index:6;flex:none}
.shb{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px 0 20px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.14em;white-space:nowrap;cursor:pointer}
.shb svg{width:18px;height:18px;color:var(--acc)}
.shb:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.shm{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:30;min-width:100%;display:grid;gap:2px;padding:6px;border:1px solid var(--line);border-radius:22px;background:var(--pop);box-shadow:0 26px 44px -20px var(--shadow)}
.shm button{padding:11px 16px;border:0;border-radius:15px;background:transparent;color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.14em;text-align:center;white-space:nowrap;cursor:pointer;transition:background-color .15s}
.shm button:hover{background-color:var(--fld)}.shm button[aria-selected="true"]{background-color:var(--acc);color:var(--on-acc)}
/* action */
.bar{display:flex;justify-content:center;margin:26px 0 6px}
button.b{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:240px;padding:16px 36px 16px 30px;border:0;border-radius:999px;color:var(--hero-tx);background:linear-gradient(120deg,var(--hero1),var(--hero2));font-family:var(--ar);font-size:17px;font-weight:700;letter-spacing:0;cursor:pointer;box-shadow:0 20px 30px -18px var(--shadow);transition:transform .3s cubic-bezier(.2,.9,.3,1.4),box-shadow .3s}
button.b svg{width:20px;height:20px}
button.b:hover{transform:translateY(-3px);box-shadow:0 26px 36px -18px var(--shadow)}button.b:active{transform:scale(.97)}
button.b:disabled{opacity:.65;cursor:wait;transform:none}button.b:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;max-width:calc(100vw - 32px);padding:10px 22px;border-radius:999px;transform:translate(-50%,20px);background:var(--hero1);color:var(--hero-tx);font-family:var(--ar);font-size:14px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.exp *{animation:none!important;transition:none!important}
@container sc (max-width:700px){
.half,.card.eng{grid-column:span 12}
.hero{grid-template-columns:minmax(0,1fr) auto;justify-items:stretch;gap:14px;padding:18px 18px 46px}
.ttl{grid-column:1/-1;grid-row:1;font-size:18px}
.hc{grid-column:1;grid-row:2;justify-self:start}
.hh{grid-column:2;grid-row:2;justify-self:end}
.cols4.pumps{grid-template-columns:repeat(2,minmax(0,1fr))}.cols5.pumps{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container sc (max-width:480px){
.sheet{padding:14px;gap:10px;border-radius:28px}
.card{padding:14px;border-radius:22px}
.hchip{width:38px;height:38px;border-radius:13px}.hchip svg{width:21px;height:21px}
.hero{gap:12px;padding:16px 14px 44px}
#dtx{font-size:19px}
.ttl{font-size:16px;letter-spacing:.06em}
.st{font-size:12px;padding:0 8px}.st.sm{font-size:10.5px;padding:0 4px;gap:4px;letter-spacing:0}.st.sm .gl{width:9px;height:9px}
.st.big{font-size:20px}.cols5 .st.big{font-size:17px}.cols4:not(.pumps) .st.big{font-size:18px}.st.big .gl{right:8px;top:8px}
.vs{height:140px}.num{font-size:24px}
.rows{grid-template-columns:minmax(0,1fr) auto}.rl{grid-column:1/-1}
.pw{grid-template-columns:minmax(0,1fr)}.ar{flex-direction:row;justify-content:center}.ar svg{transform:rotate(90deg)}
.nb .n{font-size:26px}.nb .cp{font-size:10px;letter-spacing:.03em}
.ef{gap:8px;padding:10px 12px}.ef input{font-size:14px}.ef .lki{width:13px;height:13px}.av{width:34px;height:34px;font-size:12px}
.pumps .fld .cp{font-size:10px;letter-spacing:.01em}.pumps .bu{display:block}
}
@container sc (max-width:380px){.av{display:none}}
@container sc (min-width:701px) and (max-width:820px){.pumps .bu{display:block}}
/* history */
.hs{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,16,20,.52);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:hfade .2s ease both}
.hs[hidden]{display:none!important}
.hp{display:flex;flex-direction:column;width:min(100%,640px);max-height:min(88vh,760px);overflow:hidden;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;background:var(--pop);color:var(--ink);box-shadow:0 -24px 60px -24px var(--shadow);direction:ltr;padding-bottom:env(safe-area-inset-bottom,0px);animation:hup .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes hfade{from{opacity:0}}@keyframes hup{from{transform:translateY(26px);opacity:0}}
.hph{display:flex;align-items:center;gap:12px;padding:18px 18px 12px}
.hpi{display:flex;align-items:center;justify-content:center;flex:none;width:42px;height:42px;border-radius:14px;background:var(--fld);color:var(--acc)}
.hpi svg{width:23px;height:23px}
.hpm{flex:1;min-width:0}
.hpt{font-size:13px;font-weight:700;letter-spacing:.18em}
